name: Python CI

on:
  push:
  workflow_dispatch:

jobs:
  run-python:
    runs-on: ubuntu-latest

    steps:
      # 1. Update Ubuntu package lists
      - name: Update Ubuntu
        run: |
          sudo apt-get update

      # 2. Checkout repository code
      - name: Checkout code
        uses: actions/checkout@v4

      # 3. Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 4. Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 5. Run Python file
      - name: Run Python script
        run: python main.py

      # 6. Trying secret concepts (Fixed Indentation)
      - name: Trying secret concepts
        env:
          NAME: ${{ secrets.NAME }}
          DOB: ${{ secrets.DOB }}
        run: |
          echo "NAME is configured: $([ -n "$NAME" ] && echo yes || echo no)"
          echo "DOB is configured: $([ -n "$DOB" ] && echo yes || echo no)"